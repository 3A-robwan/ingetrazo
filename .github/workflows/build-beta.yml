name: Build Beta (Rust engine)

# IngeTrazo with the native kernels (rust/ingetrazo_core) for testing:
# a portable Windows .zip and a Linux AppImage, as workflow artifacts.
# On a push to `nucleo-rust` (or by hand). Nothing is signed and nothing is attached to a release —
# these are test builds of the `nucleo-rust` branch (plan: ../PLAN.md,
# «Motor Rust (beta)»).
#
# Both jobs FAIL unless the packaged app reports the Rust engine
# (`--check` with INGETRAZO_REQUIRE_RUST=1): a Beta that silently fell
# back to Python would test nothing.
on:
  workflow_dispatch:
  # A manual-only workflow must exist on the default branch to be started;
  # this one lives on the branch, so a push to it starts it.
  push:
    branches: [nucleo-rust]

permissions:
  contents: read

env:
  INGETRAZO_REQUIRE_RUST: "1"

jobs:
  windows:
    name: Windows portable (.zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: dtolnay/rust-toolchain@stable

      - name: Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.11.2 numpy "ezdxf>=1.4.4" "manifold3d>=3.5.3" maturin
          # Same PyInstaller as the stable Windows build: its bootloader
          # compiled here, not the prebuilt one antivirus engines flag
          # (see build-windows.yml for the why).
          pip download --no-binary pyinstaller --no-deps pyinstaller -d "$RUNNER_TEMP/pyi"
          PYI_SRC="$(python -c "import glob, os, sys, tarfile; d = os.path.join(os.environ['RUNNER_TEMP'], 'pyi'); t = tarfile.open(glob.glob(os.path.join(d, 'pyinstaller-*.tar.gz'))[0]); t.extractall(d, filter='data'); print(os.path.join(d, t.getnames()[0].split('/')[0]))")"
          PYI_SRC="$(cygpath -u "$PYI_SRC")"
          rm -f "$PYI_SRC"/PyInstaller/bootloader/Windows-64bit-intel/*.exe
          (cd "$PYI_SRC/bootloader" && python ./waf all --target-arch=64bit)
          test -f "$PYI_SRC/PyInstaller/bootloader/Windows-64bit-intel/run.exe"
          test -f "$PYI_SRC/PyInstaller/bootloader/Windows-64bit-intel/runw.exe"
          pip install "$PYI_SRC"
          pip install "openskp @ git+https://github.com/iamahsanmehmood/openskp@291700bc213655a00461838de71e5f206311e619#subdirectory=packages/python"

      - name: Build the native kernels
        shell: bash
        run: |
          maturin build --release -m rust/ingetrazo_core/Cargo.toml -o "$RUNNER_TEMP/wheels"
          pip install "$RUNNER_TEMP"/wheels/ingetrazo_core-*.whl
          python -c "import core._native as n; print('engine:', n.engine()); assert n.native is not None"

      - name: Native parity tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install pytest
          python -m pytest tests/test_hlr_native.py tests/test_hlr_hidden_lines.py tests/test_hlr_line_classes.py tests/test_hlr_section_cap.py -q

      - name: DWG converter (LibreDWG win64)
        shell: bash
        run: |
          set -e
          V=0.14.8597
          SHA=7fee5c67c4f451f0542c0d6a3b12e91e99b15faf363fbf8b98ad84bac17ddfa2
          curl -fsSL -o "$RUNNER_TEMP/ldwg.zip" \
            "https://github.com/LibreDWG/libredwg/releases/download/$V/libredwg-$V-win64.zip"
          echo "$SHA  $RUNNER_TEMP/ldwg.zip" | sha256sum -c -
          mkdir -p vendor/libredwg/bin
          unzip -j -o "$RUNNER_TEMP/ldwg.zip" dwg2dxf.exe libredwg-0.dll libiconv-2.dll \
            -d vendor/libredwg/bin

      - name: PyInstaller
        shell: bash
        run: pyinstaller ingetrazo.spec --noconfirm

      - name: The package runs the Rust engine
        shell: bash
        run: |
          test -n "$(ls dist/ingetrazo/_internal/ingetrazo_core/*.pyd)"
          ./dist/ingetrazo/ingetrazo.exe --check

      - name: README in the package
        shell: bash
        run: |
          cat > dist/ingetrazo/LEEME-BETA.txt <<'EOF'
          IngeTrazo — version de PRUEBA con motor Rust (beta)

          No es la version estable: es para probar el motor nuevo.
          Haz copia de tus archivos antes de abrirlos aqui.

          Para comparar con el motor de siempre, abre IngeTrazo con la
          variable INGETRAZO_RUST=0 (en una consola: set INGETRAZO_RUST=0
          y luego ingetrazo.exe).

          Reportes: https://github.com/ingelibre/ingetrazo/issues
          (etiqueta beta-rust)
          EOF

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/ingetrazo -DestinationPath dist/ingetrazo-beta-rust-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ingetrazo-beta-rust-windows
          path: dist/ingetrazo-beta-rust-windows.zip
          retention-days: 14

  appimage:
    name: Linux AppImage
    runs-on: ubuntu-22.04      # glibc of the oldest distro we support
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl file libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libfuse2 xvfb

      - name: Python dependencies
        run: |
          python -m venv venv
          ./venv/bin/python -m pip install --quiet --upgrade pip
          ./venv/bin/python -m pip install --quiet PySide6==6.11.2 numpy pytest pyinstaller 'ezdxf>=1.4.4' 'manifold3d>=3.5.3' maturin
          ./venv/bin/python -m pip install --quiet "openskp @ git+https://github.com/iamahsanmehmood/openskp@291700bc213655a00461838de71e5f206311e619#subdirectory=packages/python"

      - name: Build the native kernels
        run: |
          ./venv/bin/maturin build --release -m rust/ingetrazo_core/Cargo.toml -o "$RUNNER_TEMP/wheels"
          ./venv/bin/python -m pip install "$RUNNER_TEMP"/wheels/ingetrazo_core-*.whl
          ./venv/bin/python -c "import core._native as n; print('engine:', n.engine()); assert n.native is not None"

      - name: Fast test suite (Rust engine)
        run: ./venv/bin/python scripts/pytest_batches.py -m "not slow" tests

      - name: Build the AppImage
        run: packaging/build-appimage.sh dist

      - name: Smoke test with a display
        run: |
          APP=$(ls dist/IngeTrazo-*-x86_64.AppImage)
          "$APP" --check
          set +e
          xvfb-run -a timeout 25 "$APP" > smoke.log 2>&1
          rc=$?
          set -e
          cat smoke.log
          test "$rc" = "124"

      - name: Rename as Beta
        run: |
          for f in dist/IngeTrazo-*-x86_64.AppImage; do
            mv "$f" "${f%-x86_64.AppImage}-beta-rust-x86_64.AppImage"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ingetrazo-beta-rust-appimage
          path: dist/IngeTrazo-*-beta-rust-x86_64.AppImage
          retention-days: 14
